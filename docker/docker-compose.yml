version: '3.9'
services:
  frontend:
    build: { context: ../frontend, dockerfile: Dockerfile }
    ports: ["3000:3000"]
    environment: [NEXT_PUBLIC_GROQ_API_KEY=${GROQ_API_KEY}]
    depends_on: [backend]

  backend:
    build: { context: ../backend, dockerfile: Dockerfile }
    ports: ["8000:8000"]
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}
      - SECRET_KEY=${SECRET_KEY:-change-me}
      - DATABASE_URL=sqlite:///./behavr.db

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
